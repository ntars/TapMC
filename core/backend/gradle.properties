# Gradle 构建的 JVM 侧参数。
#
# 为什么要写这个文件：Java 不读系统代理环境变量（HTTP_PROXY / HTTPS_PROXY 只对
# curl、npm 这类程序生效），而本项目的依赖仓库在墙外，Gradle 直连会 TLS 握手失败。
# 这里显式把代理传给 Gradle 自己的 JVM。
#
# 换机器时如果不需要代理，把下面四行注释掉即可，不影响构建逻辑。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=52201
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=52201

# 构建缓存与并行。开启并行对四个模块的小项目收益有限，但配置缓存能省掉重复解析。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true
org.gradle.caching=true
