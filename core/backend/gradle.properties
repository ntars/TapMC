# Gradle 构建的 JVM 侧参数。
#
# 不再把任何代理地址写死在仓库里。Java / Gradle 不读 HTTP_PROXY 环境变量；需要代理时
# 用 -Dhttps.proxyHost / -Dhttps.proxyPort 传入（scripts/env.sh 会检测本机代理可用性）。
# 固定在 127.0.0.1:52201 的旧配置会随机器变化失效，是可复现构建的阻断项。

# 构建缓存与并行。开启并行对四个模块的小项目收益有限，但配置缓存能省掉重复解析。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true
org.gradle.caching=true
