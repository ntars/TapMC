org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Java 不读 HTTP_PROXY / HTTPS_PROXY 环境变量，而 Gradle 拉依赖要访问
# repo.maven.apache.org 与 dl.google.com。代理环境下不显式配置会 TLS 握手失败，
# 报 "PKIX path building failed"，看不出是代理没生效。
# 换到无代理网络时把下面四行注释掉即可。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=52201
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=52201
